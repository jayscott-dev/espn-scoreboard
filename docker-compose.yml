services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-120000}

  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./ui:/app
      - /app/node_modules
    depends_on:
      - api
